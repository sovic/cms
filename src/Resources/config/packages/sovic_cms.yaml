sovic_cms:
    base_public_url: ''
    tinymce_content_css: ''

    gallery:
        base_url: ''
        upload_max_files: 25

    ai:
        # optional component snippets, AI page assistant is shown to users with API key set
        components_dir: '%kernel.project_dir%/templates/components'
        styleguide_file: '%kernel.project_dir%/templates/components/STYLEGUIDE.md'
        model: 'claude-opus-5'
        effort: 'medium'        # low | medium | high | xhigh | max, lower is faster and cheaper
        # stylesheets of the public website, so the preview looks like the real page
        preview_css:
            - '/build/app.css'
        preview_body_class: ''
        preview_wrapper_class: 'container'
        max_tokens: 16000
        history_limit: 20
